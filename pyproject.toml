[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mod-engine"
version = "0.1.0"
description = "爆款视频复刻提示词 Agent —— 领域内核（零第三方依赖）"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
app = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["engine", "engine.core", "engine.app"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
pythonpath = ["."]
addopts = "-q --tb=short"
